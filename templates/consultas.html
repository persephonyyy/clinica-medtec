{% extends "base.html" %}

{% block conteudo %}
<h1>Consultas</h1>
<a class="btn" href="{{ url_for('nova_consulta') }}">+ Nova consulta</a>

<form method="get" class="filtro" style="margin: 12px 0;">
    <label>Filtrar por data:</label>
    <input type="date" name="data" value="{{ data_filtro }}">
    <button type="submit">Filtrar</button>
    <a href="{{ url_for('listar_consultas') }}">Limpar</a>
</form>

<div class="tabela">
    <table>
        <tr>
            <th>Data</th>
            <th>Hora</th>
            <th>Paciente</th>
            <th>Motivo</th>
            <th>Ações</th>
        </tr>
        {% for c in consultas %}
        <tr>
            <td>{{ c.data }}</td>
            <td>{{ c.hora }}</td>
            <td>{{ c.paciente_nome }}</td>
            <td>{{ c.motivo }}</td>
            <td class="acoes">
                <a href="{{ url_for('editar_consulta', id=c.id) }}">Editar</a>
                <form action="{{ url_for('excluir_consulta', id=c.id) }}" method="post"
                      style="display:inline" onsubmit="return confirm('Excluir esta consulta?');">
                    <button type="submit" class="perigo">Excluir</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="5">Nenhuma consulta encontrada.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
