<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Recuperamos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h2>Clínica Recuperamos</h2>
        <nav>
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('listar_pacientes') }}">Pacientes</a>
            <a href="{{ url_for('listar_consultas') }}">Consultas</a>
            <button id="botao-tema" type="button">🌙 Escuro</button>
        </nav>
    </header>

    <main>
        {% block conteudo %}{% endblock %}
    </main>

    <script>
        const botao = document.getElementById("botao-tema");

        function aplicarTema(tema) {
            document.documentElement.setAttribute("data-tema", tema);
            botao.textContent = tema === "escuro" ? "☀️ Claro" : "🌙 Escuro";
        }

        let temaSalvo = "claro";
        try { temaSalvo = localStorage.getItem("tema") || "claro"; } catch (e) {}
        aplicarTema(temaSalvo);

        botao.addEventListener("click", function () {
            const atual = document.documentElement.getAttribute("data-tema");
            const novo = atual === "escuro" ? "claro" : "escuro";
            aplicarTema(novo);
            try { localStorage.setItem("tema", novo); } catch (e) {}
        });
    </script>
</body>
</html>
